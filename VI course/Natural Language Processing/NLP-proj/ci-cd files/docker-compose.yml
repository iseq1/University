services:
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: gamer-passport-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: gamer-passport-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: gamer-passport-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamer_passport
      POSTGRES_USER: gamer_passport
      POSTGRES_PASSWORD: gamer_passport
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamer_passport -d gamer_passport"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
