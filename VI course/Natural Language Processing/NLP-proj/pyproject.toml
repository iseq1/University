[tool.poetry]
name = "gamer-passport"
version = "0.1.0"
description = "Геймерский паспорт 2.0 — автоматическая генерация саммари профиля Steam"
authors = ["Project Team"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.115.0"
uvicorn = { version = "^0.34.0", extras = ["standard"] }
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
httpx = "^0.28.0"
sqlalchemy = { version = "^2.0.0", extras = ["asyncio"] }
asyncpg = "^0.30.0"
aiosqlite = "^0.20.0"
alembic = "^1.14.0"
celery = "^5.4.0"
redis = "^5.2.0"
qdrant-client = "^1.13.0"
rank-bm25 = "^0.2.2"
sentence-transformers = "^3.3.0"
transformers = "^4.47.0"
torch = "^2.5.0"
streamlit = "^1.41.0"
nltk = "^3.9.1"
rouge-score = "^0.1.2"
bert-score = "^0.3.13"
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
